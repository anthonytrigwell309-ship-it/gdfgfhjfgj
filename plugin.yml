name: FakeBase
version: 1.0.0
main: com.vemom.fakebase.FakeBasePlugin
api-version: '1.21'
description: Honeypot fake bases staff can spawn to catch cheaters
commands:
  fakebase:
    description: Spawn and manage fake bases
    usage: /fakebase [create|remove <id|all>|list|tp <id>|reload]
    permission: fakebase.use
permissions:
  fakebase.use:
    description: Use /fakebase
    default: op
  fakebase.alert:
    description: Receive alerts when someone touches a fake base
    default: op
  fakebase.bypass:
    description: Never trigger alerts, can take items out of fake containers
    default: op
