# ---------- What /fakebase spawns ----------
shulker-boxes: 100          # placed in a grid, random colours, filled with bait loot
spawners: 6                 # spawner blocks with a cake on top ("cake spawners")
chests: 8                   # chests along the walls, filled with bait loot
door: true                  # 3-wide opening on the south wall
max-active-bases: 5         # safety cap on how many fake bases can exist at once

wall-material: DEEPSLATE_BRICKS
light-material: SEA_LANTERN

# Mob shown in the spawners (cycled). Spawners are disabled so they never spawn mobs.
spawner-types: [ZOMBIE, SKELETON, SPIDER, BLAZE, CAVE_SPIDER, ENDERMAN]

# Placed along the walls after the chests, in order
extra-blocks: [ENDER_CHEST, ENDER_CHEST, ENCHANTING_TABLE, ANVIL, BEACON]

# 2-high pillars in the four corners
corner-blocks: [DIAMOND_BLOCK, NETHERITE_BLOCK, EMERALD_BLOCK, GOLD_BLOCK]

# Bait loot: MATERIAL:amount or MATERIAL:min-max. Players can SEE it but never take it.
loot-fill-chance: 0.5
loot:
  - DIAMOND:4-32
  - NETHERITE_INGOT:1-4
  - ENCHANTED_GOLDEN_APPLE:1-3
  - EMERALD:8-48
  - GOLD_INGOT:8-48
  - TOTEM_OF_UNDYING:1
  - ELYTRA:1
  - NETHERITE_SCRAP:2-8
  - EXPERIENCE_BOTTLE:8-32

# ---------- Detection ----------
alert:
  enter: true               # someone walks into the base
  open: true                # someone opens a container / eats the cake
  break: true               # someone breaks a block in the base
alert-cooldown-seconds: 10  # per player, per action type

# Commands run (as console) the first time a player triggers a given base. %player% is replaced.
# Leave empty to only alert staff. Example: ["tempban %player% 1d Suspected cheating"]
on-trigger-commands: []
